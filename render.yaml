# Render Blueprint for EGC Pulse — files live at the repo TOP LEVEL (flat).
# Free tier: no credit card. A free service sleeps after ~15 min idle and resets
# its data on restart. To keep data, see "PAID / PERSISTENT" at the bottom.
services:
  - type: web
    name: egc-pulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: INTERNAL_USE_ONLY
        value: "true"
      - key: AI_INSIGHTS_ENABLED
        value: "false"
      # ── Secrets / connected-account values: set these in the Render dashboard
      #    (Environment tab). `sync: false` means Render prompts for them and they
      #    are NEVER stored in the repo. Leave blank to keep a source gated. ──
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_IG_USER_ID
        sync: false
      - key: META_FB_PAGE_ID
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: LICENSED_PROVIDER_API_KEY
        sync: false
      - key: LICENSED_PROVIDER_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

# ─────────────────────────────────────────────────────────────────────────────
# PAID / PERSISTENT (keeps collected data; needs a card, ~$7/mo):
#   1. change `plan: free` to `plan: starter`
#   2. add under the service (same indent as `envVars:`):
#        disk:
#          name: pulse-data
#          mountPath: /data
#          sizeGB: 1
#   3. add to the env var list:
#        - key: PULSE_DB
#          value: /data/pulse_demo.db
# ─────────────────────────────────────────────────────────────────────────────
