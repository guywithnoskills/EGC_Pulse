# Render Blueprint for EGC Pulse.
# This version is for a repo where the app files sit at the TOP LEVEL
# (pulse_demo.py, Dockerfile, etc. in the root — not inside a demo/ folder).
#
# DEFAULT = FREE tier: no credit card. A free service sleeps after ~15 min idle
# and its data resets on restart. To keep data permanently, see "PAID" at bottom.
services:
  - type: web
    name: egc-pulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: INTERNAL_USE_ONLY
        value: "true"
      - key: AI_INSIGHTS_ENABLED
        value: "false"
      # Open web social discovery (primary listening source). Provider name is not
      # a secret; the API key is. SEARCH_CSE_ID is your Programmable Search Engine id.
      - key: SEARCH_PROVIDER
        value: "google_cse"
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_CSE_ID
        sync: false
      # Secrets — Render prompts for these; never stored in the repo. Leave blank
      # to keep that source honestly gated (the app still runs on keyless sources).
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: LICENSED_PROVIDER_API_KEY
        sync: false
      - key: LICENSED_PROVIDER_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

# ─────────────────────────────────────────────────────────────────────────────
# PAID / PERSISTENT (keeps collected data; needs a card, ~$7/mo):
#   1. change `plan: free` to `plan: starter`
#   2. add under the service (same indent as `envVars:`):
#        disk:
#          name: pulse-data
#          mountPath: /data
#          sizeGB: 1
#   3. add to the env var list:
#        - key: PULSE_DB
#          value: /data/pulse_demo.db
# ─────────────────────────────────────────────────────────────────────────────
